info:
  name: record-settlement
  type: http
  seq: 7

http:
  method: POST
  url: "{{baseUrl}}/api/groups/{{groupId}}/settlements"
  body:
    type: json
    data: |-
      {
        "toUserId": "{{newMemberId}}",
        "amount": 30.00
      }
  auth:
    type: bearer
    token: "{{accessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
