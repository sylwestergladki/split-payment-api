info:
  name: create-group
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/groups"
  body:
    type: json
    data: |-
      {
        "name": "Mountain trip"
      }
  auth:
    type: bearer
    token: "{{accessToken}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        const response = res.getBody();

        if (res.getStatus() === 201 && response?.id) {
            bru.setEnvVar("groupId", response.id);
            console.log("Saved groupId:", response.id);
        } else {
            console.log("Group was not created or response has no id");
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
