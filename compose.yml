
services:
  postgres:
    image: postgres:17
    container_name: splitpayment-db
    environment:
      POSTGRES_DB: splitpayment
      POSTGRES_USER: splitpayment
      POSTGRES_PASSWORD: "local_splitpayment_password"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U splitpayment -d splitpayment"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak-db:
    image: postgres:17
    container_name: splitpayment-keycloak-db
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: "local_keycloak_password"
    volumes:
      - keycloak_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    container_name: splitpayment-keycloak
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: "local_admin_password"
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: "local_keycloak_password"
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      keycloak-db:
        condition: service_healthy

volumes:
  postgres_data:
  keycloak_data:
